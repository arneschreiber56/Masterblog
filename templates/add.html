<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<header>
    <h1>Welcome to My Flask Blog!</h1>
</header>
<body>
    <nav>
        <a href="/" class="btn-add">Go back home</a>
    </nav>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul class="flash-messages">
                {% for category, message in messages %}
                    <li class="flash {{ category }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}
    <div class="post">
        <h2>Create your Post: </h2>
        <form action="{{ url_for('add') }}" method="post">
            <label for="author">Enter your Name: </label>
            <input type="text" id="author" name="author">
            <label for="title">Enter Post Title: </label>
            <input type="text" id="title" name="title">
            <label for="content">Enter Post Content: </label>
            <input type="text" id="content" name="content">
            <button class="btn-add" type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
